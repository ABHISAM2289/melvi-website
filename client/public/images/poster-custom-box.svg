<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a140a" />
      <stop offset="40%" stop-color="#421d0d" />
      <stop offset="100%" stop-color="#140803" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <pattern id="pattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="1" fill="#f59e0b" fill-opacity="0.15" />
      <path d="M 0 30 L 60 30 M 30 0 L 30 60" stroke="#f59e0b" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="28" fill="url(#bgGrad)" />
  <rect width="1200" height="380" rx="28" fill="url(#pattern)" />
  <rect x="12" y="12" width="1176" height="356" rx="20" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Content Left -->
  <g transform="translate(60, 55)">
    <!-- Badge -->
    <rect x="0" y="0" width="160" height="32" rx="16" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.5" />
    <text x="80" y="21" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="12" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="2">BESPOKE ATELIER</text>

    <!-- Main Title -->
    <text x="0" y="90" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="1">Create Your Custom Box</text>

    <!-- Subtitle -->
    <text x="0" y="132" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" fill="#e5decb" letter-spacing="0.5">Handpick signature bonbons • Enclose personal handwritten chef notes</text>

    <!-- CTA Pill -->
    <g transform="translate(0, 175)">
      <rect x="0" y="0" width="220" height="46" rx="23" fill="url(#goldGrad)" />
      <text x="110" y="29" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="bold" fill="#241c18" text-anchor="middle" letter-spacing="1">LAUNCH ATELIER →</text>
    </g>
  </g>

  <!-- Graphic Elements Right -->
  <g transform="translate(860, 40)">
    <circle cx="150" cy="150" r="140" fill="#f59e0b" fill-opacity="0.08" />
    <circle cx="150" cy="150" r="110" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="6,6" stroke-opacity="0.4" />
    
    <!-- Bonbon Illustration / Decorative Icon -->
    <g transform="translate(150, 150)">
      <rect x="-65" y="-65" width="130" height="130" rx="26" fill="#1b0c06" stroke="url(#goldGrad)" stroke-width="2.5" />
      <circle cx="0" cy="0" r="42" fill="#d97706" fill-opacity="0.3" />
      <polygon points="0,-28 20,-8 14,24 -14,24 -20,-8" fill="url(#goldGrad)" />
      <circle cx="0" cy="3" r="8" fill="#fef08a" />
      <text x="0" y="85" font-family="'Cinzel', 'Playfair Display', serif" font-size="11" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="2">MELVI MASTER ATELIER</text>
    </g>
  </g>
</svg>
