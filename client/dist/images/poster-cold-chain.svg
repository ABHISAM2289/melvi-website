<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>
    <linearGradient id="cyanBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e3a47" />
      <stop offset="50%" stop-color="#164e63" />
      <stop offset="100%" stop-color="#08212b" />
    </linearGradient>
    <linearGradient id="cyanPillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <pattern id="cyanPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.2" fill="#38bdf8" fill-opacity="0.12" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="28" fill="url(#cyanBgGrad)" />
  <rect width="1200" height="380" rx="28" fill="url(#cyanPattern)" />
  <rect x="12" y="12" width="1176" height="356" rx="20" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Content Left -->
  <g transform="translate(60, 55)">
    <!-- Badge -->
    <rect x="0" y="0" width="200" height="32" rx="16" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" />
    <text x="100" y="21" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="900" fill="#a5f3fc" text-anchor="middle" letter-spacing="2">❄ 16°C COLD-CHAIN</text>

    <!-- Main Title -->
    <text x="0" y="90" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="1">Melt-Proof Courier Transit</text>

    <!-- Subtitle -->
    <text x="0" y="132" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" fill="#cffafe" letter-spacing="0.5">Free insulated dry-ice packaging • Zero melt guarantee across India</text>

    <!-- CTA Pill -->
    <g transform="translate(0, 175)">
      <rect x="0" y="0" width="220" height="46" rx="23" fill="url(#cyanPillGrad)" />
      <text x="110" y="29" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">TRACK SHIPMENT →</text>
    </g>
  </g>

  <!-- Graphic Elements Right -->
  <g transform="translate(860, 40)">
    <circle cx="150" cy="150" r="140" fill="#38bdf8" fill-opacity="0.08" />
    <circle cx="150" cy="150" r="110" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6,6" stroke-opacity="0.4" />
    
    <g transform="translate(150, 150)">
      <rect x="-65" y="-65" width="130" height="130" rx="26" fill="#082733" stroke="#38bdf8" stroke-width="2.5" />
      <!-- Snowflake shape -->
      <path d="M0,-38 L0,38 M-38,0 L38,0 M-26,-26 L26,26 M-26,26 L26,-26" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
      <circle cx="0" cy="0" r="9" fill="#a5f3fc" />
      <text x="0" y="85" font-family="'Cinzel', 'Playfair Display', serif" font-size="11" font-weight="bold" fill="#a5f3fc" text-anchor="middle" letter-spacing="2">INSULATED BOX</text>
    </g>
  </g>
</svg>
